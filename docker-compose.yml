services:
  postgres:
    image: postgres:16-alpine
    container_name: bengkelos-postgres
    restart: always
    environment:
      POSTGRES_USER: bengkel
      POSTGRES_PASSWORD: bengkel_secret_password
      POSTGRES_DB: bengkelos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bengkel -d bengkelos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
